name: Sync bundle to job-search-plugin

# job-search-plugin ships a pre-built copy of this server (mcp/index.mjs) so
# plugin installers never run a build step. Without this workflow that copy
# has to be rebuilt and committed by hand -- which is exactly how it silently
# drifted out of sync before (job-search-plugin stayed on 0.4.0 while this
# repo moved on). This workflow removes the manual step entirely.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tenant-mcp
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

      - name: Checkout job-search-plugin
        uses: actions/checkout@v4
        with:
          repository: Bundelkund/job-search-plugin
          token: ${{ secrets.JOB_SEARCH_PLUGIN_PUSH_TOKEN }}
          path: job-search-plugin

      - name: Copy build output
        run: cp server/index.js job-search-plugin/mcp/index.mjs

      - name: Commit and push if changed
        working-directory: job-search-plugin
        run: |
          git config user.name "tenant-mcp-sync[bot]"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- mcp/index.mjs; then
            echo "mcp/index.mjs unchanged, nothing to sync"
            exit 0
          fi
          VERSION=$(node -p "require('../package.json').version")
          git add mcp/index.mjs
          git commit -m "chore(mcp): sync tenant-mcp bundle to ${VERSION}

          Auto-generated by tenant-mcp's sync-job-search-plugin workflow from
          ${{ github.repository }}@${{ github.sha }}. Do not hand-edit
          mcp/index.mjs -- edit tenant-mcp's src/ instead."
          git push
